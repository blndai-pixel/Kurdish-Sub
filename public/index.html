<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ژێرنووسی ڤیدیۆ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0c;--panel:#101414;--card:#121616;--field:#1c2020;--line:#232b2a;
  --accent:#2dd4c0;--accent-bg:#0f2f2b;--accent-ink:#04201c;
  --mut:#7b8583;--txt:#eef3f2;--dim:#9aa5a3;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;min-height:100vh}
button{font-family:inherit;color:inherit}
svg{display:block}

/* ---------- Home ---------- */
#home{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px}
.card h1{font-size:19px;font-weight:700;margin-bottom:14px}
.field{position:relative}
.field input{width:100%;height:58px;background:var(--field);border:1px solid var(--line);border-radius:18px;color:var(--txt);font-family:inherit;font-size:16px;padding:0 18px 0 52px;outline:none;text-align:right}
.field input:focus{border-color:#2f6f66}
.field input::placeholder{color:#6f7a78}
.field input.ltr{direction:ltr;text-align:left}
.paste{position:absolute;left:8px;top:8px;width:42px;height:42px;border-radius:12px;border:0;background:none;color:#a5afad;cursor:pointer;display:grid;place-items:center}
.paste:active{background:#262d2c}
.go{margin-top:16px;width:100%;height:64px;border:0;border-radius:22px;background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;box-shadow:0 10px 30px -10px rgba(45,212,192,.55)}
.go:active{transform:scale(.99)}
.go[disabled]{opacity:.7}
#status{margin-top:14px;font-size:14px;line-height:1.7;color:var(--dim);min-height:0;word-break:break-word}
#status.err{color:#ff9b9b}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite}

/* ---------- App ---------- */
.wrap{max-width:720px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px}
.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;flex:none}
#vtitle{font-size:14px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.player{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
#yt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border:0}
.tap{position:absolute;inset:0;z-index:2}
.sub{position:absolute;z-index:3;left:3%;right:3%;text-align:center;pointer-events:none;font-weight:700;line-height:1.55}
.sub.p-bottom{bottom:5%}
.sub.p-top{top:5%}
.sub.p-middle{top:50%;transform:translateY(-50%)}
.sub .main{display:inline}
.sub .main span.w{transition:color .08s}
.sub.bg-shadow .main{text-shadow:0 2px 8px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9)}
.sub.bg-shadow.light .main{text-shadow:0 2px 8px rgba(255,255,255,.9),0 0 3px rgba(255,255,255,.9)}
.sub.bg-box .main{background:rgba(0,0,0,.68);padding:2px 12px;border-radius:10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub .src{display:block;margin-top:4px;font-size:.62em;font-weight:500;opacity:.9;direction:ltr}
.sub .w.next{opacity:.45}
.sub .w.cur{color:var(--accent)!important;opacity:1}

.bar{padding:14px 16px 4px;background:#000}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:#2a302f}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:#2a302f}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff}
#seek{direction:ltr}
#seek::-webkit-slider-thumb{width:18px;height:18px;margin-top:-6px;background:var(--accent)}
#seek::-moz-range-thumb{width:18px;height:18px;background:var(--accent)}
.ctrl{display:flex;align-items:center;gap:6px;padding:4px 14px 14px;background:#000;direction:ltr;flex-wrap:wrap}
.ctrl button{background:none;border:0;color:#fff;cursor:pointer;font-size:15px;padding:8px 10px;border-radius:10px}
.ctrl button:active{background:#222}
.chip{border:1px solid #666!important;font-family:monospace;font-size:14px!important}
.time{font-family:monospace;color:#bbb;font-size:14px;margin:0 6px}

/* ---------- Style panel ---------- */
.panel{margin:14px 12px 0;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px 18px 8px}
.ph{display:flex;justify-content:space-between;align-items:center}
.ph h2{font-size:22px;font-weight:800}
.reset{background:none;border:0;color:var(--mut);font-size:14px;cursor:pointer;padding:6px}
.sh{display:flex;align-items:center;gap:10px;margin:14px 0 4px;color:var(--accent);font-size:17px;font-weight:700;background:none;border:0;width:100%;cursor:pointer;text-align:right}
.sh .chev{margin-right:auto;transition:transform .2s}
.sh.closed .chev{transform:rotate(180deg)}
.body.closed{display:none}
.grp{padding:14px 0}
.lbl{display:flex;justify-content:space-between;color:var(--dim);font-size:15px;margin-bottom:12px}
.lbl b{font-weight:500;font-family:monospace;color:var(--mut)}
.lbl b.t{color:var(--accent)}
.szrow{display:flex;align-items:center;gap:12px}
.szrow span{font-weight:800}
.opts{display:flex;gap:10px}
.opt{flex:1;height:54px;border-radius:18px;border:1px solid var(--line);background:var(--field);font-size:16px;font-weight:600;cursor:pointer;display:grid;place-items:center}
.opt.on{background:#10302c;border-color:var(--accent);color:#fff}
.opt.ico{flex:0 0 64px}
.colors{display:flex;gap:12px;justify-content:flex-start}
.dot{width:46px;height:46px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.dot.on{outline:3px solid var(--accent);outline-offset:3px}
#offset{direction:ltr;background-image:radial-gradient(circle,#59625f 2px,transparent 2.6px);background-size:4.1667% 6px;background-repeat:repeat-x;background-position:left center;height:28px}
#offset::-webkit-slider-runnable-track{background:transparent}
#offset::-moz-range-track{background:transparent}
.hint{color:var(--mut);font-size:13.5px;line-height:1.7;margin-bottom:12px}
.sw{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding:16px 0}
.sw .tx{flex:1}
.sw .tx b{display:block;font-size:19px;font-weight:700}
.sw .tx span{color:var(--mut);font-size:13.5px;line-height:1.7}
.toggle{flex:none;width:66px;height:38px;border-radius:20px;border:0;background:#2a302f;position:relative;cursor:pointer;transition:background .2s}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(0)}
.toggle:not(.on)::after{transform:translateX(28px)}

/* ---------- Tabs & list ---------- */
.tabs{display:flex;gap:6px;align-items:center;padding:14px 12px;margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tab{padding:10px 16px;border-radius:12px;color:#aab3b1;cursor:pointer;white-space:nowrap;border:0;background:none;font-size:16px}
.tab.on{background:var(--accent-bg);color:var(--accent)}
.ibtn{border:1px solid var(--line);border-radius:14px;width:46px;height:46px;background:none;color:#ccd;cursor:pointer;display:grid;place-items:center;flex:none}
.ibtn.on{border-color:var(--accent);color:var(--accent)}
.sp{flex:1}
#cnt{direction:ltr;unicode-bidi:isolate}
.head{display:flex;justify-content:space-between;padding:18px 20px;color:var(--mut);font-size:15px}
#list{position:relative;padding:0 14px 60px;max-height:50vh;overflow-y:auto}
.row{padding:14px 16px;border-radius:18px;border:1px solid transparent;cursor:pointer;color:#5e6866;margin-bottom:6px}
.row .l1{display:flex;justify-content:space-between;gap:12px;font-size:19px;line-height:1.7}
.row .t{font-family:monospace;font-size:14px;white-space:nowrap;padding-top:6px}
.row .l2{direction:ltr;text-align:left;font-size:16px;margin-top:6px;display:none;color:#aab}
.row.on{background:#0d1b19;border-color:#1c4a43;color:#fff}
.row.on .t{color:var(--accent)}
.row.on .l2.show{display:block}
</style>
</head>
<body>

<!-- ============ Home ============ -->
<section id="home">
  <form class="card" id="f" autocomplete="off">
    <h1>لینکی ڤیدیۆی یوتیوب</h1>
    <div class="field">
      <input id="link" type="text" inputmode="url" placeholder="لینکی یوتیوب لێرە دابنێ…" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="button" class="paste" id="paste" aria-label="paste">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="12" height="16" rx="2.5"/><path d="M9.5 5V4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1"/></svg>
      </button>
    </div>
    <button class="go" id="go" type="submit">
      <svg id="goIcon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h8M8 3v2M5.5 11c1.2 2.5 3.2 4.2 6 5M10.5 5c-.5 3-2.5 6-6.5 8"/><path d="M13 20l4-9 4 9M14.5 17h5"/></svg>
      <span id="goTxt">وەرگێڕان</span>
    </button>
    <div id="status"></div>
  </form>
</section>

<!-- ============ App ============ -->
<section id="app" hidden>
<div class="wrap">
  <div class="top">
    <button class="back" id="back" aria-label="back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <span id="vtitle"></span>
  </div>

  <div class="player" id="playerBox">
    <div id="yt"></div><div class="tap" id="tap"></div>
    <div class="sub p-bottom bg-shadow" id="sub"></div>
  </div>
  <div class="bar"><input type="range" id="seek" min="0" max="1000" value="0"></div>
  <div class="ctrl">
    <button id="pp">▶</button>
    <button id="b10">⟲ 10</button>
    <button id="f10">10 ⟳</button>
    <span class="time" id="time">0:00 / 0:00</span>
    <button class="chip" id="spd">1.0×</button>
  </div>

  <!-- شێوازی ژێرنووس -->
  <div class="panel">
    <div class="ph">
      <h2>شێوازی ژێرنووس</h2>
      <button class="reset" id="reset">ڕێکخستنەوە</button>
    </div>
    <button class="sh" id="shToggle">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 12h10M7 15.5h6"/></svg>
      <span>دیزاینی ژێرنووس</span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <div class="body" id="shBody">
      <div class="grp">
        <div class="lbl"><span>قەبارە</span><b id="sizeVal">20px</b></div>
        <div class="szrow"><span style="font-size:15px">ئ</span><input type="range" id="size" min="12" max="44" step="1" value="20" dir="rtl"><span style="font-size:26px">ئ</span></div>
      </div>
      <div class="grp">
        <div class="lbl"><span>پاشبنەما</span></div>
        <div class="opts" id="bgOpts">
          <button class="opt" data-v="shadow">سێبەر</button>
          <button class="opt" data-v="box">چوارگۆشە</button>
          <button class="opt" data-v="none">هیچ</button>
        </div>
      </div>
      <div class="grp">
        <div class="lbl"><span>ڕەنگی دەق</span></div>
        <div class="colors" id="colors">
          <button class="dot" data-v="#ffffff" style="background:#fff" aria-label="white"></button>
          <button class="dot" data-v="#facc15" style="background:#facc15" aria-label="yellow"></button>
          <button class="dot" data-v="#86efac" style="background:#86efac" aria-label="green"></button>
          <button class="dot" data-v="#93c5fd" style="background:#93c5fd" aria-label="blue"></button>
          <button class="dot" data-v="#f472b6" style="background:#f472b6" aria-label="pink"></button>
          <button class="dot" data-v="#000000" style="background:#000" aria-label="black"></button>
        </div>
      </div>
      <div class="grp">
        <div class="lbl"><span>شوێن</span></div>
        <div class="opts" id="posOpts">
          <button class="opt" data-v="top">سەر ڤیدیۆکە</button>
          <button class="opt" data-v="bottom">خوار ڤیدیۆکە</button>
          <button class="opt ico" data-v="middle" aria-label="middle">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
          </button>
        </div>
      </div>
      <div class="grp">
        <div class="lbl"><span>کاتی ژێرنووس</span><b class="t" id="offVal">0.0s</b></div>
        <p class="hint">ئەمە ڕێکدەخە ئەگەر دێڕەکان پێش یان پاش قسەکەرەکە دەردەکەون</p>
        <input type="range" id="offset" min="-3" max="3" step="0.25" value="0">
      </div>
      <div class="sw">
        <button class="toggle on" id="follow" aria-label="follow words"></button>
        <div class="tx"><b>شوێنکەوتنی وشەکان</b><span>ڕووناککردنەوەی وشەکان هاوکات لەگەڵ خوێندنەوەیان</span></div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="ibtn on" id="tg" title="ژێرنووس">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 12h10M7 15.5h6"/></svg>
    </button>
    <button class="ibtn" id="dl" title="SRT">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
    </button>
    <span class="sp"></span>
    <button class="tab" data-m="off">ناچالاک</button>
    <button class="tab" data-m="src" id="srcTab">ئەسڵی</button>
    <button class="tab on" data-m="ku">کوردی</button>
    <button class="tab" data-m="both">دووزمانە</button>
  </div>
  <div class="head"><span id="cnt">0 / 0</span><span>دەقی ڤیدیۆ</span></div>
  <div id="list"></div>
</div>
</section>

<script>
const $ = s => document.querySelector(s);
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const vidId = u => (u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/) || [])[1];

/* ---------------- settings ---------------- */
const DEF = { size: 20, bg: 'shadow', color: '#ffffff', pos: 'bottom', offset: 0, follow: true };
let S = Object.assign({}, DEF);
try { Object.assign(S, JSON.parse(localStorage.getItem('subStyle') || '{}')); } catch (e) {}
const saveS = () => { try { localStorage.setItem('subStyle', JSON.stringify(S)); } catch (e) {} };

/* ---------------- state ---------------- */
let data = null, mode = 'ku', subOn = true;
let curLine = -1, curWord = -1, wordEls = [], wordStarts = [];
let player = null, playerReady = false, pendingId = null, seeking = false;
const ok = () => player && playerReady;

/* ---------------- home ---------------- */
const linkEl = $('#link');
linkEl.addEventListener('input', () => linkEl.classList.toggle('ltr', linkEl.value.length > 0));
$('#paste').onclick = async () => {
  try { const t = await navigator.clipboard.readText(); if (t) { linkEl.value = t.trim(); linkEl.classList.add('ltr'); } }
  catch (e) { linkEl.focus(); }
};

function setStatus(msg, err) { const s = $('#status'); s.textContent = msg || ''; s.classList.toggle('err', !!err); }
function setBusy(b) {
  $('#go').disabled = b;
  $('#goTxt').textContent = b ? 'جاوەڕێ بە…' : 'وەرگێڕان';
  $('#goIcon').classList.toggle('spin', b);
}

$('#f').onsubmit = async e => {
  e.preventDefault();
  const id = vidId(linkEl.value.trim());
  if (!id) return setStatus('لینکەکە دروست نییە', true);
  setStatus('ژێرنووس دەهێنرێت و وەردەگێڕدرێت… ڕەنگە ماوەیەک بخایەنێت');
  setBusy(true);
  try {
    const r = await fetch('/api/transcript?v=' + id + '&lang=ckb');
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    data = j; curLine = -1; curWord = -1;
    try { $('#srcTab').textContent = new Intl.DisplayNames(['ckb'], { type: 'language' }).of(j.sourceLang.split('-')[0]) || 'ئەسڵی'; } catch (e) {}
    $('#vtitle').textContent = j.title || '';
    showApp(id);
    setStatus('');
  } catch (err) { setStatus('⚠ ' + err.message, true); }
  setBusy(false);
};

function showApp(id) {
  $('#home').hidden = true; $('#app').hidden = false;
  window.scrollTo(0, 0);
  renderList(); applyStyle(); startPlayer(id);
}
$('#back').onclick = () => {
  if (ok()) try { player.pauseVideo(); } catch (e) {}
  $('#app').hidden = true; $('#home').hidden = false;
};

/* ---------------- YouTube player ---------------- */
const yts = document.createElement('script'); yts.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(yts);
let apiReady = false;
window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pendingId) startPlayer(pendingId); };
function startPlayer(id) {
  pendingId = id;
  if (!apiReady) return;
  if (ok()) { player.loadVideoById(id); pendingId = null; return; }
  if (player) return;
  player = new YT.Player('yt', {
    videoId: id,
    playerVars: { controls: 0, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, cc_load_policy: 0, disablekb: 1 },
    events: {
      onReady: () => { playerReady = true; if (pendingId) { player.loadVideoById(pendingId); pendingId = null; } },
      onStateChange: e => $('#pp').textContent = e.data === 1 ? '❚❚' : '▶'
    }
  });
}

/* ---------------- subtitle overlay ---------------- */
function lineText(l) { return mode === 'src' ? l.text : l.tr; }

function buildLine(idx) {
  const el = $('#sub');
  el.innerHTML = ''; wordEls = []; wordStarts = [];
  if (!data || !subOn || mode === 'off' || idx < 0) return;
  const l = data.lines[idx];
  const main = document.createElement('span'); main.className = 'main';
  const words = lineText(l).split(/\s+/).filter(Boolean);
  const weights = words.map(w => w.length + 1), total = weights.reduce((a, b) => a + b, 0) || 1;
  let acc = 0;
  words.forEach((w, i) => {
    const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w;
    main.appendChild(sp);
    if (i < words.length - 1) main.appendChild(document.createTextNode(' '));
    wordEls.push(sp); wordStarts.push(acc / total); acc += weights[i];
  });
  el.appendChild(main);
  if (mode === 'both') { const b = document.createElement('span'); b.className = 'src'; b.textContent = l.text; el.appendChild(b); }
}

function paintWords(w) {
  wordEls.forEach((sp, i) => {
    sp.classList.remove('cur', 'next');
    if (!S.follow) return;
    if (i === w) sp.classList.add('cur'); else if (i > w) sp.classList.add('next');
  });
}

function applyStyle() {
  const el = $('#sub');
  el.style.fontSize = S.size + 'px';
  el.style.color = S.color;
  el.className = 'sub p-' + S.pos + ' bg-' + S.bg + (S.color === '#000000' ? ' light' : '');
  $('#size').value = S.size; $('#sizeVal').textContent = S.size + 'px';
  $('#offset').value = S.offset; $('#offVal').textContent = S.offset.toFixed(1) + 's';
  document.querySelectorAll('#bgOpts .opt').forEach(b => b.classList.toggle('on', b.dataset.v === S.bg));
  document.querySelectorAll('#posOpts .opt').forEach(b => b.classList.toggle('on', b.dataset.v === S.pos));
  document.querySelectorAll('#colors .dot').forEach(b => b.classList.toggle('on', b.dataset.v === S.color));
  $('#follow').classList.toggle('on', S.follow);
  paintWords(curWord);
}

$('#size').oninput = e => { S.size = +e.target.value; applyStyle(); saveS(); };
$('#offset').oninput = e => { S.offset = +e.target.value; applyStyle(); saveS(); };
$('#bgOpts').onclick = e => { const b = e.target.closest('.opt'); if (b) { S.bg = b.dataset.v; applyStyle(); saveS(); } };
$('#posOpts').onclick = e => { const b = e.target.closest('.opt'); if (b) { S.pos = b.dataset.v; applyStyle(); saveS(); } };
$('#colors').onclick = e => { const b = e.target.closest('.dot'); if (b) { S.color = b.dataset.v; applyStyle(); saveS(); } };
$('#follow').onclick = () => { S.follow = !S.follow; applyStyle(); saveS(); };
$('#reset').onclick = () => { S = Object.assign({}, DEF); applyStyle(); saveS(); };
$('#shToggle').onclick = () => { $('#shToggle').classList.toggle('closed'); $('#shBody').classList.toggle('closed'); };

/* ---------------- transcript list ---------------- */
function renderList() {
  const list = $('#list'); list.innerHTML = '';
  data.lines.forEach(l => {
    const d = document.createElement('div'); d.className = 'row';
    d.innerHTML = '<div class="l1"><span class="x"></span><span class="t"></span></div><div class="l2"></div>';
    d.querySelector('.t').textContent = fmt(l.start);
    d.querySelector('.l2').textContent = l.text;
    d.onclick = () => { if (ok()) player.seekTo(l.start + S.offset, true); };
    list.appendChild(d);
  });
  applyMode();
}
function applyMode() {
  if (!data) return;
  document.querySelectorAll('.row').forEach((d, i) => {
    d.querySelector('.x').textContent = lineText(data.lines[i]);
    d.querySelector('.l2').classList.toggle('show', mode === 'both');
  });
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.m === mode));
  buildLine(curLine); paintWords(curWord);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { mode = t.dataset.m; applyMode(); });
$('#tg').onclick = () => { subOn = !subOn; $('#tg').classList.toggle('on', subOn); buildLine(curLine); paintWords(curWord); };

/* ---------------- tick ---------------- */
function findLine(te) {
  const L = data.lines; let lo = 0, hi = L.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (L[m].start <= te + 0.02) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}
setInterval(() => {
  if (!ok() || !player.getCurrentTime) return;
  const t = player.getCurrentTime(), D = player.getDuration() || 0;
  $('#time').textContent = fmt(t) + ' / ' + fmt(D);
  if (D && !seeking) $('#seek').value = t / D * 1000;
  if (!data) return;
  const te = t - S.offset;
  let idx = findLine(te);
  if (idx >= 0 && te > data.lines[idx].end + 0.4) idx = -1;
  if (idx !== curLine) {
    curLine = idx; curWord = -1;
    buildLine(idx);
    const rows = document.querySelectorAll('.row');
    rows.forEach((d, i) => d.classList.toggle('on', i === idx));
    if (idx >= 0 && rows[idx]) {
      const list = $('#list'), r = rows[idx];
      list.scrollTo({ top: r.offsetTop - list.clientHeight / 2 + r.clientHeight / 2, behavior: 'smooth' });
    }
    $('#cnt').textContent = (idx + 1) + ' / ' + data.lines.length;
  }
  if (idx >= 0 && wordEls.length) {
    const l = data.lines[idx];
    const nextStart = data.lines[idx + 1] ? data.lines[idx + 1].start : Infinity;
    const end = Math.min(l.end, nextStart);
    const dur = Math.max(0.3, end - l.start);
    const frac = Math.min(1, Math.max(0, (te - l.start) / dur));
    let w = 0;
    for (let i = 0; i < wordStarts.length; i++) if (wordStarts[i] <= frac + 0.001) w = i;
    if (w !== curWord) { curWord = w; paintWords(w); }
  }
}, 70);

/* ---------------- controls ---------------- */
$('#seek').oninput = () => { seeking = true; };
$('#seek').onchange = e => { if (ok()) player.seekTo(e.target.value / 1000 * player.getDuration(), true); seeking = false; };
const toggle = () => { if (!ok()) return; player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); };
$('#pp').onclick = $('#tap').onclick = toggle;
$('#b10').onclick = () => ok() && player.seekTo(player.getCurrentTime() - 10, true);
$('#f10').onclick = () => ok() && player.seekTo(player.getCurrentTime() + 10, true);
const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2]; let si = 2;
$('#spd').onclick = () => { si = (si + 1) % speeds.length; if (ok()) player.setPlaybackRate(speeds[si]); $('#spd').textContent = speeds[si].toFixed(1) + '×'; };

$('#dl').onclick = () => {
  if (!data) return;
  const ts = x => { x = Math.max(0, x); const h = Math.floor(x / 3600), m = Math.floor(x % 3600 / 60), s = Math.floor(x % 60), ms = Math.round(x % 1 * 1000);
    return [h, m, s].map(n => String(n).padStart(2, '0')).join(':') + ',' + String(Math.min(ms, 999)).padStart(3, '0'); };
  const srt = data.lines.map((l, i) => {
    const end = Math.min(l.end, data.lines[i + 1] ? data.lines[i + 1].start : l.end);
    return `${i + 1}\n${ts(l.start + S.offset)} --> ${ts(end + S.offset)}\n${lineText(l)}\n`;
  }).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([srt], { type: 'text/plain;charset=utf-8' }));
  a.download = 'subtitle-ckb.srt'; a.click();
};

applyStyle();
</script>
</body>
